#
# /etc/rawosd/rawosd.conf: rawosd transient feedback presentation
#

font = "monospace:size=9";
position = "bottom";
geometry = false;
duration_ms = 800;
padding = 10;
offset = 24;
min_width = 0;

colors = {
  selected = {
    foreground = "#ffffff";
    background = "#0066ff";
    accent = "#0066ff";
  };
  floating = {
    foreground = "#ffffff";
    background = "#0066ff";
    accent = "#0066ff";
  };
};

layouts = {
  tile = "[]=";
  floating = "<1/1>";
  monocle = "[1/1]";
  bstack = "TTT";
  bstack_horizontal = "===";
  grid = "###";
};
